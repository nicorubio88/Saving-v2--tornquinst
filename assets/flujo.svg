<svg viewBox="0 0 1300 2150" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5C6B58"/></marker></defs><rect x="0" y="0" width="1300" height="2150" rx="0" ry="0" fill="#F7F9F4" opacity="1"/><rect x="0" y="0" width="1300" height="130" rx="0" ry="0" fill="#2E4470" opacity="1"/><text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#BFD0F5" text-anchor="start"><tspan x="40" dy="0">ANÁLISIS DE CAUSA RAÍZ</tspan></text><text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" fill="#fff" text-anchor="start"><tspan x="40" dy="0">Cómo funciona el sistema · Planta Tornquist</tspan></text><text x="1260" y="100" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#D5DFF5" text-anchor="end"><tspan x="1260" dy="0">De "pasó esto" a "esto hay que hacer"</tspan></text><rect x="60" y="170" width="1180" height="66" rx="14" ry="14" fill="#FFFFFF" stroke="#D8E0CE" stroke-width="1.6" opacity="1"/><text x="78" y="200" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#20291F" text-anchor="start"><tspan x="78" dy="0">1. Pasó algo en la planta</tspan></text><text x="100" y="225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="100" dy="0">Un corte, una parada, un desvío de calidad, un incidente...</tspan></text><line x1="650.0" y1="236" x2="650.0" y2="276" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#arrowhead)"/><rect x="60" y="276" width="1180" height="150" rx="14" ry="14" fill="#FFFFFF" stroke="#D8E0CE" stroke-width="1.6" opacity="1"/><circle cx="88" cy="304" r="15" fill="#2E4470"/><text x="88" y="309" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="88" dy="0">2</tspan></text><text x="112" y="306" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#20291F" text-anchor="start"><tspan x="112" dy="0">2. Cargás los datos básicos</tspan></text><circle cx="90" cy="331" r="3" fill="#3E5C9A"/><text x="105" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#20291F" text-anchor="start"><tspan x="105" dy="0">Área / equipo (mismo árbol que Tarjetas TPM)</tspan></text><circle cx="90" cy="355" r="3" fill="#3E5C9A"/><text x="105" y="360" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#20291F" text-anchor="start"><tspan x="105" dy="0">Tiempo de parada y si hubo riesgo a personas</tspan></text><circle cx="90" cy="379" r="3" fill="#3E5C9A"/><text x="105" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#20291F" text-anchor="start"><tspan x="105" dy="0">Tipo de falla (corte de hoja, mecánica, servicios...)</tspan></text><circle cx="90" cy="403" r="3" fill="#3E5C9A"/><text x="105" y="408" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#20291F" text-anchor="start"><tspan x="105" dy="0">¿Primera vez o ya pasó antes? ¿Causa clara o no?</tspan></text><line x1="650.0" y1="426" x2="650.0" y2="466" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#arrowhead)"/><polygon points="650.0,466 930.0,531.0 650.0,596 370.0,531.0" fill="#E6ECFA" stroke="#2E4470" stroke-width="2"/><text x="650.0" y="523.0" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#2E4470" text-anchor="middle"><tspan x="650.0" dy="0">3. El sistema elige el camino</tspan></text><text x="650.0" y="547.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#2E4470" text-anchor="middle"><tspan x="650.0" dy="0">según tiempo de parada + tipo de falla + certeza</tspan></text><path d="M 650.0 596 Q 416.0 562 250.0 628" fill="none" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#arrowhead)"/><line x1="650.0" y1="596" x2="660.0" y2="628" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#arrowhead)"/><path d="M 650.0 596 Q 884.0000000000001 562 1070.0 628" fill="none" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#arrowhead)"/><rect x="60" y="632" width="380" height="430" rx="18" ry="18" fill="#FFFFFF" stroke="#548235" stroke-width="2" opacity="1"/><rect x="80" y="650" width="340" height="26" rx="13.0" ry="13.0" fill="#548235" opacity="1"/><text x="250.0" y="667.59" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="250.0" dy="0">CAMINO CORTO</tspan></text><text x="250.0" y="702" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#3D5F26" text-anchor="middle"><tspan x="250.0" dy="0">Solo 5 Porqués</tspan></text><text x="80" y="732" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5C6B58" text-anchor="start"><tspan x="80" dy="0">Primera vez, causa bastante clara,</tspan><tspan x="80" dy="16">hasta 30 min de parada</tspan></text><rect x="80" y="787" width="340" height="46" rx="10" ry="10" fill="#E7F2DC" opacity="1"/><circle cx="102" cy="810" r="12" fill="#548235"/><text x="102" y="815" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="102" dy="0">1</tspan></text><text x="124" y="816" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#3D5F26" text-anchor="start"><tspan x="124" dy="0">5 Porqués</tspan></text><rect x="76" y="970" width="348" height="76" rx="10" ry="10" fill="#FDF0DC" stroke="#F2D9AE" stroke-width="1.2" opacity="1"/><text x="88" y="992" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="800" fill="#8A5A0A" text-anchor="start"><tspan x="88" dy="0">⚠ Si un porqué culpa a una persona</tspan></text><text x="88" y="1010" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#8A5A0A" text-anchor="start"><tspan x="88" dy="0">("no prestó atención", "se olvidó"), el</tspan><tspan x="88" dy="14">sistema pide seguir preguntando: no se puede</tspan><tspan x="88" dy="14">cerrar ahí.</tspan></text><rect x="470" y="632" width="380" height="430" rx="18" ry="18" fill="#FFFFFF" stroke="#3E5C9A" stroke-width="2" opacity="1"/><rect x="490" y="650" width="340" height="26" rx="13.0" ry="13.0" fill="#3E5C9A" opacity="1"/><text x="660.0" y="667.59" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="660.0" dy="0">CAMINO INTERMEDIO</tspan></text><text x="660.0" y="702" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#2E4470" text-anchor="middle"><tspan x="660.0" dy="0">5W1H + 5 Porqués</tspan></text><text x="490" y="732" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5C6B58" text-anchor="start"><tspan x="490" dy="0">Causa dudosa, se repitió, o es corte de</tspan><tspan x="490" dy="16">hoja / calidad / servicios (aunque sea corto)</tspan></text><rect x="490" y="787" width="340" height="46" rx="10" ry="10" fill="#E6ECFA" opacity="1"/><circle cx="512" cy="810" r="12" fill="#3E5C9A"/><text x="512" y="815" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="512" dy="0">1</tspan></text><text x="534" y="816" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#2E4470" text-anchor="start"><tspan x="534" dy="0">5W + 1H</tspan></text><line x1="660.0" y1="833" x2="660.0" y2="851" stroke="#3E5C9A" stroke-width="2" marker-end="url(#arrowhead)"/><rect x="490" y="851" width="340" height="46" rx="10" ry="10" fill="#E6ECFA" opacity="1"/><circle cx="512" cy="874" r="12" fill="#3E5C9A"/><text x="512" y="879" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="512" dy="0">2</tspan></text><text x="534" y="880" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#2E4470" text-anchor="start"><tspan x="534" dy="0">5 Porqués</tspan></text><rect x="486" y="970" width="348" height="76" rx="10" ry="10" fill="#FDF0DC" stroke="#F2D9AE" stroke-width="1.2" opacity="1"/><text x="498" y="992" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="800" fill="#8A5A0A" text-anchor="start"><tspan x="498" dy="0">⚠ Si un porqué culpa a una persona</tspan></text><text x="498" y="1010" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#8A5A0A" text-anchor="start"><tspan x="498" dy="0">("no prestó atención", "se olvidó"), el</tspan><tspan x="498" dy="14">sistema pide seguir preguntando: no se puede</tspan><tspan x="498" dy="14">cerrar ahí.</tspan></text><rect x="880" y="632" width="380" height="430" rx="18" ry="18" fill="#FFFFFF" stroke="#B8402A" stroke-width="2" opacity="1"/><rect x="900" y="650" width="340" height="26" rx="13.0" ry="13.0" fill="#B8402A" opacity="1"/><text x="1070.0" y="667.59" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="1070.0" dy="0">ANÁLISIS MÁXIMO</tspan></text><text x="1070.0" y="702" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#8A2E1C" text-anchor="middle"><tspan x="1070.0" dy="0">5W1H + Espina + 5 Porqués</tspan></text><text x="900" y="732" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5C6B58" text-anchor="start"><tspan x="900" dy="0">Más de 3 h de parada, riesgo a personas,</tspan><tspan x="900" dy="16">crónico, o sin ninguna idea de la causa</tspan></text><rect x="900" y="787" width="340" height="46" rx="10" ry="10" fill="#FBE6E1" opacity="1"/><circle cx="922" cy="810" r="12" fill="#B8402A"/><text x="922" y="815" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="922" dy="0">1</tspan></text><text x="944" y="816" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#8A2E1C" text-anchor="start"><tspan x="944" dy="0">5W + 1H</tspan></text><line x1="1070.0" y1="833" x2="1070.0" y2="851" stroke="#B8402A" stroke-width="2" marker-end="url(#arrowhead)"/><rect x="900" y="851" width="340" height="46" rx="10" ry="10" fill="#FBE6E1" opacity="1"/><circle cx="922" cy="874" r="12" fill="#B8402A"/><text x="922" y="879" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="922" dy="0">2</tspan></text><text x="944" y="880" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#8A2E1C" text-anchor="start"><tspan x="944" dy="0">Espina de pescado (6M)</tspan></text><line x1="1070.0" y1="897" x2="1070.0" y2="915" stroke="#B8402A" stroke-width="2" marker-end="url(#arrowhead)"/><rect x="900" y="915" width="340" height="46" rx="10" ry="10" fill="#FBE6E1" opacity="1"/><circle cx="922" cy="938" r="12" fill="#B8402A"/><text x="922" y="943" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="922" dy="0">3</tspan></text><text x="944" y="944" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#8A2E1C" text-anchor="start"><tspan x="944" dy="0">5 Porqués</tspan></text><rect x="896" y="970" width="348" height="76" rx="10" ry="10" fill="#FDF0DC" stroke="#F2D9AE" stroke-width="1.2" opacity="1"/><text x="908" y="992" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="800" fill="#8A5A0A" text-anchor="start"><tspan x="908" dy="0">⚠ Si un porqué culpa a una persona</tspan></text><text x="908" y="1010" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#8A5A0A" text-anchor="start"><tspan x="908" dy="0">("no prestó atención", "se olvidó"), el</tspan><tspan x="908" dy="14">sistema pide seguir preguntando: no se puede</tspan><tspan x="908" dy="14">cerrar ahí.</tspan></text><path d="M 250.0 1082 Q 250.0 1112 646.0 1112" fill="none" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#arrowhead)"/><line x1="660.0" y1="1082" x2="650.0" y2="1112" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#arrowhead)"/><path d="M 1070.0 1082 Q 1070.0 1112 654.0 1112" fill="none" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#arrowhead)"/><line x1="650.0" y1="1112" x2="650.0" y2="1148" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#arrowhead)"/><rect x="60" y="1148" width="1180" height="92" rx="14" ry="14" fill="#FFFFFF" stroke="#2E4470" stroke-width="1.6" opacity="1"/><circle cx="88" cy="1176" r="15" fill="#2E4470"/><text x="88" y="1181" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="88" dy="0">4</tspan></text><text x="112" y="1178" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#2E4470" text-anchor="start"><tspan x="112" dy="0">Contramedida inmediata (restaurar)</tspan></text><text x="112" y="1206" font-family="Arial, Helvetica, sans-serif" font-size="12.8" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="112" dy="0">Qué se hizo para que el equipo vuelva a funcionar YA —</tspan><tspan x="112" dy="17">esto no es la solución de fondo, es la reparación del momento.</tspan></text><line x1="650.0" y1="1240" x2="650.0" y2="1274" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#arrowhead)"/><rect x="60" y="1274" width="1180" height="92" rx="14" ry="14" fill="#FFFFFF" stroke="#3D5F26" stroke-width="1.6" opacity="1"/><circle cx="88" cy="1302" r="15" fill="#3D5F26"/><text x="88" y="1307" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="88" dy="0">5</tspan></text><text x="112" y="1304" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#3D5F26" text-anchor="start"><tspan x="112" dy="0">Clasificar la causa raíz → pilar de TPM</tspan></text><text x="112" y="1332" font-family="Arial, Helvetica, sans-serif" font-size="12.8" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="112" dy="0">Falta estándar · falta capacitación · falta mantenimiento ·</tspan><tspan x="112" dy="17">falta autónomo · diseño · seguridad · gestión visual · material</tspan></text><line x1="650.0" y1="1366" x2="650.0" y2="1400" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#arrowhead)"/><rect x="60" y="1400" width="1180" height="130" rx="14" ry="14" fill="#FFFFFF" stroke="#3D5F26" stroke-width="1.6" opacity="1"/><circle cx="88" cy="1428" r="15" fill="#3D5F26"/><text x="88" y="1433" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="88" dy="0">6</tspan></text><text x="112" y="1430" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#3D5F26" text-anchor="start"><tspan x="112" dy="0">6. Plan de acción con responsable y fecha</tspan></text><rect x="80" y="1466" width="570.0" height="46" rx="10" ry="10" fill="#E7F2DC" opacity="1"/><text x="365.0" y="1495" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="800" fill="#3D5F26" text-anchor="middle"><tspan x="365.0" dy="0">🔗  Genera tarjeta en TPM</tspan></text><rect x="670.0" y="1466" width="570.0" height="46" rx="10" ry="10" fill="#FDF0DC" opacity="1"/><text x="955.0" y="1495" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="800" fill="#8A5A0A" text-anchor="middle"><tspan x="955.0" dy="0">🔗  O evento en EHS (si hay riesgo)</tspan></text><line x1="650.0" y1="1530" x2="650.0" y2="1564" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#arrowhead)"/><rect x="60" y="1564" width="1180" height="92" rx="14" ry="14" fill="#FFFFFF" stroke="#2E4470" stroke-width="1.6" opacity="1"/><circle cx="88" cy="1592" r="15" fill="#2E4470"/><text x="88" y="1597" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="88" dy="0">7</tspan></text><text x="112" y="1594" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#2E4470" text-anchor="start"><tspan x="112" dy="0">Expansión horizontal (P7)</tspan></text><text x="112" y="1622" font-family="Arial, Helvetica, sans-serif" font-size="12.8" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="112" dy="0">¿Dónde más de la planta puede pasar esto mismo?</tspan><tspan x="112" dy="17">Resolverlo una vez en toda la planta, no solo donde apareció.</tspan></text><line x1="650.0" y1="1656" x2="650.0" y2="1690" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#arrowhead)"/><polygon points="650.0,1690 960.0,1755.0 650.0,1820 340.0,1755.0" fill="#FFFFFF" stroke="#20291F" stroke-width="2"/><text x="650.0" y="1747.0" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#20291F" text-anchor="middle"><tspan x="650.0" dy="0">8. Verificación (P6): ¿se repitió?</tspan></text><text x="650.0" y="1771.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5C6B58" text-anchor="middle"><tspan x="650.0" dy="0">el caso se cierra por resultado, no por tarea cumplida</tspan></text><line x1="650.0" y1="1820" x2="650.0" y2="1880" stroke="#548235" stroke-width="2.6" marker-end="url(#arrowhead)"/><rect x="460.0" y="1880" width="380" height="60" rx="14" ry="14" fill="#E7F2DC" stroke="#548235" stroke-width="1.6" opacity="1"/><text x="650.0" y="1906" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="800" fill="#3D5F26" text-anchor="middle"><tspan x="650.0" dy="0">NO se repitió</tspan></text><text x="650.0" y="1925" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#3D5F26" text-anchor="middle"><tspan x="650.0" dy="0">✓ Caso cerrado — solución efectiva</tspan></text><path d="M 960.0 1755.0 L 1230 1755.0 L 1230 592 L 1240 592" fill="none" stroke="#B8402A" stroke-width="2.4" stroke-dasharray="7,5" marker-end="url(#arrowhead)"/><rect x="1040" y="1729.0" width="200" height="52" rx="12" ry="12" fill="#FBE6E1" stroke="#B8402A" stroke-width="1.4" opacity="1"/><text x="1140" y="1751.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="800" fill="#8A2E1C" text-anchor="middle"><tspan x="1140" dy="0">SÍ se repitió</tspan></text><text x="1140" y="1769.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600" fill="#8A2E1C" text-anchor="middle"><tspan x="1140" dy="0">→ reabrir el análisis</tspan></text><rect x="0" y="1970" width="1300" height="180" rx="0" ry="0" fill="#2E4470" opacity="1"/><text x="650.0" y="2010" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="650.0" dy="0">El objetivo: la causa raíz más rápido posible, sin quedarse corto en los casos graves</tspan></text><text x="650.0" y="2038" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#BFD0F5" text-anchor="middle"><tspan x="650.0" dy="0">Planta Tornquist · Papelera del Sur — Grupo H. Koch · Kobetsu Kaizen aplicado, un caso a la vez</tspan></text></svg>